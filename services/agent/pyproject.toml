[project]
name = "deepresearch-disease-agent"
version = "0.1.0"
description = "Local-first ischemic-stroke drug-discovery research agent service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk[db]>=2.5,<2.6",
  "greenlet>=3.2,<4",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-google-genai>=0.7b1,<1",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "uvicorn[standard]>=0.35,<1",
  "weave>=0.53,<0.54",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
deepresearch-agent = "deepresearch_agent.cli:serve"
collect-public-seed = "deepresearch_agent.seed.cli:main"
analyze-flagged-traces = "deepresearch_agent.observability.flag_analysis:main"
run-offline-eval = "deepresearch_agent.evaluation.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch_agent"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/deepresearch_agent/evaluation/fixtures/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["deepresearch_agent"]
exclude = ["src/deepresearch_agent/evaluation/fixtures"]

[[tool.mypy.overrides]]
module = ["fitz.*", "weave.*", "google.adk.*", "opentelemetry.*"]
ignore_missing_imports = true
